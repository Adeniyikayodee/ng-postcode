[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ng-postcode"
version = "0.3.1"
description = "Parse, validate and format Nigeria's NIPOST digital postcode (NDAPS) offline, plus a client for the postcode.gov.ng API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kayode Adeniyi" }]
keywords = ["nigeria", "postcode", "nipost", "ndaps", "address", "address-validation", "geocoding", "postal-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
client = ["anyio>=3", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/Adeniyikayodee/ng-postcode"
Issues = "https://github.com/Adeniyikayodee/ng-postcode/issues"
"API docs" = "https://docs.postcode.gov.ng"

[dependency-groups]
dev = ["anyio>=3", "httpx>=0.27", "mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
