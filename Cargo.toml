[package]
name = "ng-postcode"
version = "0.1.1"
edition = "2021"
description = "Nigeria's NIPOST digital postcode (NDAPS): parse, validate and format codes offline, plus a client for the postcode.gov.ng API. Unofficial."
license = "MIT"
repository = "https://github.com/Adeniyikayodee/ng-postcode"
documentation = "https://docs.rs/ng-postcode"
keywords = ["nigeria", "postcode", "nipost", "address", "geocoding"]
categories = ["parser-implementations", "api-bindings", "science::geo", "value-formatting"]
readme = "README.md"

[features]
serde = ["dep:serde"]
api = ["serde", "serde/derive", "dep:serde_json"]
client = ["api", "dep:ureq"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "lookup"
required-features = ["client"]

[package.metadata.docs.rs]
all-features = true
