[package]
name = "ng-postcode"
version = "0.5.4"
edition = "2021"
rust-version = "1.85"
description = "Validate, parse and format Nigerian postcodes offline: Nigeria's 11-character NIPOST digital postcode (NDAPS). Includes a client for the postcode.gov.ng API."
license = "MIT"
homepage = "https://adeniyikayodee.github.io/ng-postcode/"
repository = "https://github.com/Adeniyikayodee/ng-postcode"
documentation = "https://docs.rs/ng-postcode"
keywords = ["nigeria", "postcode", "nipost", "ndaps", "postal-code"]
categories = ["parser-implementations", "api-bindings", "science::geo", "value-formatting"]
readme = "CRATE.md"
# The repository also holds the Python package and the shared spec.
include = ["/src", "/examples", "/CRATE.md", "/LICENSE"]

[features]
serde = ["dep:serde"]
api = ["serde", "dep:serde_json"]
client = ["api", "dep:ureq"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "lookup"
required-features = ["client"]

[package.metadata.docs.rs]
all-features = true
