name: Release JavaScript library

# Push a tag such as js-v0.1.0. npm trusts this workflow directly, so no
# token is stored anywhere.
on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/ng-postcode-js
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "js-v$(node -p "require('./packages/ng-postcode-js/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Publish, unless npm already has this version
        run: |
          version="$(node -p "require('./packages/ng-postcode-js/package.json').version")"
          npm view "ng-postcode-js@$version" version || npm publish --workspace ng-postcode-js --provenance --access public
