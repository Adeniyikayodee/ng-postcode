name: Release PostgreSQL extension

# Push a tag such as pg-v0.1.0. Nothing goes to a registry: a package for each PostgreSQL
# version is attached to a GitHub release. Each is built against the PostgreSQL project's
# own Debian and Ubuntu packages, so it unpacks at the root of a system that uses them.
on:
  push:
    tags: ["pg-v*"]

# GitHub can deliver one tag push twice; the second run waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        pg: ["14", "15", "16", "17", "18"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Tag matches the extension version
        run: test "pg-v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - name: PostgreSQL ${{ matrix.pg }} from the PostgreSQL project's repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common libclang-dev
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.pg }}" "postgresql-server-dev-${{ matrix.pg }}"
          sudo chmod -R a+rwX "/usr/lib/postgresql/${{ matrix.pg }}/lib" "/usr/share/postgresql/${{ matrix.pg }}/extension"
      - run: cargo install cargo-pgrx --version 0.19.3 --locked
      - run: cargo pgrx init "--pg${{ matrix.pg }}" "/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
      - run: cargo pgrx test "pg${{ matrix.pg }}" --no-default-features
      - name: Package
        run: |
          cargo pgrx package --no-default-features --features "pg${{ matrix.pg }}" --pg-config "/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
          tar -czf "$RUNNER_TEMP/ng_postcode-${GITHUB_REF_NAME#pg-v}-pg${{ matrix.pg }}-$(uname -m).tar.gz" -C "target/release/ng_postcode-pg${{ matrix.pg }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg${{ matrix.pg }}-${{ matrix.os }}
          path: ${{ runner.temp }}/ng_postcode-*.tar.gz

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "PostgreSQL extension ${GITHUB_REF_NAME#pg-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
