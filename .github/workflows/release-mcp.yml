name: Release MCP server

# Push a tag such as mcp-v0.1.0. PyPI and the MCP Registry both trust this
# workflow through OIDC, so no token is stored anywhere.
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag, package and server.json versions agree
        run: |
          version="$(uv version --short)"
          test "mcp-v$version" = "$GITHUB_REF_NAME"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev ruff check .
      - run: uv run --group dev mypy
      - run: uv run --group dev pytest
      - run: uv build
      # Fails when a dependency this version requires is not on PyPI yet.
      - name: The wheel installs with its dependencies from PyPI
        run: uv run --isolated --no-project --with dist/*.whl python -c "import ng_postcode_mcp.server"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-dist
          path: mcp/dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ng-postcode-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job can publish, so the binary is pinned to a release and its checksum.
      # To upgrade, change both from the release's checksums file.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # The registry reads the README from PyPI, which can lag a fresh upload.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

  # Glama rebuilds its listing when a GitHub release appears.
  github-release:
    needs: registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh release create "$GITHUB_REF_NAME" --title "MCP server ${GITHUB_REF_NAME#mcp-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Smithery serves a bundle that pins one version, so it is rebuilt for each release.
  # Smithery has no trusted publishing: its key is a secret of the smitheryAPI environment.
  smithery:
    needs: pypi
    runs-on: ubuntu-latest
    environment: smitheryAPI
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: uv run --group dev python ../scripts/smithery_bundle.py "$RUNNER_TEMP/ng-postcode.mcpb"
      - name: Publish the bundle to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::warning::No SMITHERY_API_KEY in the smitheryAPI environment, so the Smithery listing was not updated."
            exit 0
          fi
          npx -y @smithery/cli@4.11.1 mcp publish "$RUNNER_TEMP/ng-postcode.mcpb" -n adeniyikayode22/ng-postcode
