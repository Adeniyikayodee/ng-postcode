# Actions are pinned to commits; this keeps the pins and the lockfiles current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: [/js, /mcp/smithery]
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    ignore:
      # Maven 3.10 stages a file that central-publishing-maven-plugin 0.11.0 leaves in the
      # bundle, and Central then refuses it. The `java` CI job checks the bundle.
      - dependency-name: org.apache.maven:apache-maven
        versions: [">=3.10"]
  - package-ecosystem: uv
    directories: [/python, /mcp, /agent]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
