[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ng-address-resolver"
version = "0.1.0"
description = "Resolve free-text Nigerian addresses to NIPOST digital postcodes (NDAPS), only as precisely as the evidence allows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kayode Adeniyi" }]
keywords = ["nigeria", "address", "postcode", "nipost", "ndaps", "geocoding", "address-parser", "claude", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "ng-postcode[client]>=0.1,<0.2", "pydantic>=2.7"]

[project.optional-dependencies]
claude = ["anthropic>=1.11,<2"]

[project.scripts]
ng-address = "ng_address.cli:main"

[project.urls]
Repository = "https://github.com/Adeniyikayodee/ng-postcode"

[dependency-groups]
dev = ["anthropic>=1.11,<2", "mypy>=1.13", "pytest>=8", "ruff>=0.8"]

# Inside the repository, build against the local library so the two never drift.
[tool.uv.sources]
ng-postcode = { path = "../python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ng_address"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
